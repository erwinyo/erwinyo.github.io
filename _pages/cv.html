<style>
  #cv-download { text-decoration: none; }
  .cv-preview { margin-top: 1em; }
  .cv-preview canvas {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 1em;
    border: 1px solid var(--global-border-color);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
  }
</style>

<p>
  <a id="cv-download" class="btn" href="{{ page.cv_pdf | relative_url }}" download>
    <i class="fas fa-download" aria-hidden="true"></i> Download CV (PDF)
  </a>
</p>

<div id="cv-preview" class="cv-preview">Loading preview…</div>

<script type="module">
  const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/";
  const box = document.getElementById("cv-preview");
  const url = document.getElementById("cv-download").href;
  let pdf;
  let lastWidth = 0;

  async function render() {
    const width = box.clientWidth;
    if (!width || width === lastWidth) return;
    lastWidth = width;
    const dpr = window.devicePixelRatio || 1;
    const canvases = [];
    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      const scale = (width / page.getViewport({ scale: 1 }).width) * dpr;
      const viewport = page.getViewport({ scale: scale });
      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", "CV page " + n + " of " + pdf.numPages);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport }).promise;
      canvases.push(canvas);
    }
    box.replaceChildren(...canvases);
  }

  try {
    const pdfjsLib = await import(PDFJS + "pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs";
    pdf = await pdfjsLib.getDocument(url).promise;
    await render();
    let timer;
    window.addEventListener("resize", function () {
      clearTimeout(timer);
      timer = setTimeout(render, 200);
    });
  } catch (err) {
    console.error(err);
    box.textContent = "Preview unavailable. Use the download button above.";
  }
</script>
